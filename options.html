<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser AI Connector</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">BROWSER AI CONNECTOR</p>
        <h1>AI credentials</h1>
      </header>

      <form id="assignment-form">
        <label for="provider">Provider</label>
        <select id="provider" name="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
        </select>
        <label for="origin">Page origin</label>
        <input id="origin" name="origin" type="url" placeholder="https://notebook.example" required>
        <label id="api-key-label" for="api-key">OpenAI API key</label>
        <input id="api-key" name="api-key" type="password" autocomplete="new-password" required>
        <button id="save-assignment" type="submit">Save assignment</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <section aria-labelledby="assignments-heading">
        <h2 id="assignments-heading">Credential assignments</h2>
        <div id="assignments" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
